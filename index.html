<style>
:root{--ink:#08161D;--deep:#0E2732;--line:#22505F;--hair:#1B4353;
  --pale:#8FBECD;--mist:#C7DDE5;--white:#EAF4F7;--marker:#F0B429;--sockeye:#D9503B;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Bricolage Grotesque","Inter Tight",system-ui,sans-serif;
  --body:"Inter Tight",system-ui,-apple-system,sans-serif;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--mist);font-family:var(--body);
  display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:
    repeating-linear-gradient(115deg,transparent 0 38px,rgba(143,190,205,.035) 38px 39px),
    repeating-linear-gradient(115deg,transparent 0 152px,rgba(143,190,205,.05) 152px 153px);}
.box{width:100%;max-width:430px}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mark svg{flex:none}
.mark span{font-family:var(--mono);font-size:10.5px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--pale)}
h1{font-family:var(--disp);font-weight:800;font-size:31px;line-height:1.08;
  margin:0 0 10px;color:var(--white);letter-spacing:-.02em}
p.lede{font-size:14.5px;color:var(--pale);margin:0 0 26px;line-height:1.5}
label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--pale);margin-bottom:9px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--deep);border:1px solid var(--line);color:var(--white);
  font-family:var(--mono);font-size:15px;padding:13px 14px;border-radius:2px;outline:none;transition:.15s}
input:focus{border-color:var(--marker);box-shadow:0 0 0 3px rgba(240,180,41,.13)}
button{background:var(--marker);color:#12222A;border:0;font-family:var(--mono);font-weight:500;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:0 20px;border-radius:2px;
  cursor:pointer;transition:.15s;white-space:nowrap}
button:hover{background:#FFC94A}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.msg{font-family:var(--mono);font-size:12px;margin-top:14px;min-height:18px;color:var(--pale)}
.msg.bad{color:var(--sockeye)}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--hair);
  font-family:var(--mono);font-size:10.5px;color:#4E7484;line-height:1.75}
@media (prefers-reduced-motion:no-preference){
  .box{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main class="box">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M2 19 C 8 19, 9 8, 14 8 C 19 8, 20 14, 24 14" fill="none" stroke="#5FC2C6" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M2 23 C 9 23, 11 14, 16 14 C 21 14, 21 19, 24 19" fill="none" stroke="#F0B429" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M2 15 C 7 15, 8 3, 13 3 C 18 3, 19 9, 24 9" fill="none" stroke="#B98BD9" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
    </svg>
    <span>Northern Headwaters Initiative</span>
  </div>

  <h1>Campaign metrics</h1>
  <p class="lede">Consultation click-through for Kaska, the Klappan and the Meziadin. Enter the team password to open the dashboard.</p>

  <label for="pw">Password</label>
  <div class="row">
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="••••••••">
    <button id="go">Open</button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <p class="foot">
    Internal working numbers — please don't circulate the link.<br>
    Live from Umami &middot; gonorthernheadwaters.ca
  </p>
</main>

<script>
const P = JSON.parse(document.getElementById("payload").textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById("msg");
const pw  = document.getElementById("pw");
const go  = document.getElementById("go");

async function unlock(pass, quiet){
  if(!pass){ pw.focus(); return false; }
  go.disabled = true;
  msg.className = "msg";
  msg.textContent = "Unlocking\u2026";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key  = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const buf  = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
    sessionStorage.setItem("nhi-key", pass);
    const html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){
    sessionStorage.removeItem("nhi-key");
    go.disabled = false;
    if(!quiet){
      msg.className = "msg bad";
      msg.textContent = "That password didn't work. Try again.";
      pw.value = ""; pw.focus();
    } else { msg.textContent = ""; }
    return false;
  }
}

go.addEventListener("click", () => unlock(pw.value.trim(), false));
pw.addEventListener("keydown", e => { if(e.key === "Enter") unlock(pw.value.trim(), false); });

/* stay unlocked for the rest of the browser session */
const saved = sessionStorage.getItem("nhi-key");
if(saved) unlock(saved, true); else pw.focus();
</script>
